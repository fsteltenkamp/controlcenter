[package]
name = "controlcenter"
version = "0.1.0"
edition = "2021"
description = "TUI for configuring, activating, and monitoring SSH tunnels"
license = "MIT"

[[bin]]
name = "controlcenter"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
